<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wardrobe - All Items</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 28px; margin-bottom: 24px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .item-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .item-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .item-info {
            padding: 16px;
        }
        .item-brand {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .item-type {
            font-size: 13px;
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>All Clothes</h1>
        <div class="grid">
            <div class="item-card">
                <img src="items/allsaints-grey-sweater.jpg" alt="Grey Sweater">
                <div class="item-info">
                    <div class="item-brand">All Saints</div>
                    <div class="item-type">Sweater - Grey</div>
                </div>
            </div>
            <div class="item-card">
                <img src="items/allsaints-black-jeans.jpg" alt="Black Jeans">
                <div class="item-info">
                    <div class="item-brand">All Saints</div>
                    <div class="item-type">Jeans - Black</div>
                </div>
            </div>
            <div class="item-card">
                <img src="items/oro-black-boots.jpg" alt="Black Boots">
                <div class="item-info">
                    <div class="item-brand">Oro</div>
                    <div class="item-type">Boots - Black</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
