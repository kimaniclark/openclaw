<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 1080px;
    height: auto;
    margin: 0 auto;
    background: #1f2122;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
  }
  
  .photo-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    gap: 0;
  }
  
  .photo-row img {
    width: 100%;
    aspect-ratio: 4/5;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  
  .pricing-section {
    background: #1f2122;
    padding: 32px 80px 24px;
    text-align: center;
  }
  
  .pricing-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 16px 0;
    gap: 30px;
  }
  
  .pricing-row .price {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 38px;
    color: #ffffff;
    min-width: 160px;
    text-align: right;
  }
  
  .pricing-row .divider {
    width: 2px;
    height: 44px;
    background: #c2a163;
  }
  
  .pricing-row .desc {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: 20px;
    color: #a0a0a0;
    text-align: left;
    min-width: 500px;
  }
  
  .footer-info {
    background: #1f2122;
    padding: 10px 80px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .footer-info .left,
  .footer-info .right {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 13px;
    color: #888;
    letter-spacing: 1px;
  }
  
  .footer-info .center img {
    height: 60px;
    width: auto;
    opacity: 0.9;
  }

  .footer-bottom {
    background: #1f2122;
    padding: 0 80px 10px;
    text-align: center;
  }

  .footer-bottom p {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 12px;
    color: #666;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<!-- Top Photo Row -->
<div class="photo-row">
  <img src="flyer-photos/model-1.jpg" alt="">
  <img src="flyer-photos/model-2.jpg" alt="">
  <img src="flyer-photos/model-3.jpg" alt="">
  <img src="flyer-photos/model-4.jpg" alt="">
  <img src="flyer-photos/model-5.jpg" alt="">
</div>

<!-- Pricing Section -->
<div class="pricing-section">
  <div class="pricing-row">
    <div class="price">$600</div>
    <div class="divider"></div>
    <div class="desc">Digitals &amp; Headshots</div>
  </div>
  <div class="pricing-row">
    <div class="price">$900</div>
    <div class="divider"></div>
    <div class="desc">Digitals, Headshots, &amp; 1 Portfolio Look</div>
  </div>
  <div class="pricing-row">
    <div class="price">$1,300</div>
    <div class="divider"></div>
    <div class="desc">Digitals, Headshots, &amp; 2 Portfolio Looks</div>
  </div>
  <div class="pricing-row">
    <div class="price">$1,900</div>
    <div class="divider"></div>
    <div class="desc">Digitals, Headshots, &amp; 2 Portfolio Looks + Hair &amp; Makeup</div>
  </div>
</div>

<!-- Footer Info -->
<div class="footer-info">
  <div class="left">www.kissmodelmanagement.com</div>
  <div class="center"><img src="kiss-logo-white.png" alt="KiSS"></div>
  <div class="right">@kissmodelsus</div>
</div>

<!-- Bottom Photo Row -->
<div class="photo-row">
  <img src="flyer-photos/model-6.jpg" alt="">
  <img src="flyer-photos/model-7.jpg" alt="">
  <img src="flyer-photos/model-8.jpg" alt="">
  <img src="flyer-photos/model-9.jpg" alt="">
  <img src="flyer-photos/model-10.jpg" alt="">
</div>

</body>
</html>
